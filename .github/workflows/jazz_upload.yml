name: Jazz Wolf Upload

on:
  schedule:
    - cron: '0 9 * * *'  # 毎日 18:00 JST (= 09:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Jazz Wolf automation
        env:
          JAZZ_CLIENT_SECRET_JSON: ${{ secrets.JAZZ_CLIENT_SECRET_JSON }}
          JAZZ_REFRESH_TOKEN: ${{ secrets.JAZZ_REFRESH_TOKEN }}
          JAZZ_GDRIVE_FOLDER_ID: ${{ secrets.JAZZ_GDRIVE_FOLDER_ID }}
          JAZZ_IMAGE_FOLDER_ID: ${{ secrets.JAZZ_IMAGE_FOLDER_ID }}
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
          REPORT_GMAIL_ADDRESS: ${{ secrets.REPORT_GMAIL_ADDRESS }}
          REPORT_GMAIL_APP_PASSWORD: ${{ secrets.REPORT_GMAIL_APP_PASSWORD }}
          REPORT_TO_EMAIL: ${{ secrets.REPORT_TO_EMAIL }}
        run: python jazz_main.py

      - name: Commit PDCA data
        if: always()
        run: |
          git config user.name "BGM Bot"
          git config user.email "bot@bgm-youtube-auto"
          git add data/*.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "データ変更なし"
          else
            git commit -m "chore: PDCAデータ更新 (${{ github.workflow }})"
            git pull --rebase origin main || true
            git push || echo "push失敗(次回実行時に再試行)"
          fi

name: Coffee Shop Upload

on:
  schedule:
    - cron: '0 21 * * 1,3,5'  # 月水金 06:00 JST (= 21:00 UTC 前日)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Coffee Shop automation
        env:
          CAFE_CLIENT_SECRET_JSON: ${{ secrets.CAFE_CLIENT_SECRET_JSON }}
          CAFE_REFRESH_TOKEN: ${{ secrets.CAFE_REFRESH_TOKEN }}
          CAFE_GDRIVE_FOLDER_ID: ${{ secrets.CAFE_GDRIVE_FOLDER_ID }}
          CAFE_PLAYLIST_ID: ${{ secrets.CAFE_PLAYLIST_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python cafe_main.py

      - name: Commit PDCA data
        if: always()
        run: |
          git config user.name "BGM Bot"
          git config user.email "bot@bgm-youtube-auto"
          git add data/*.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "データ変更なし"
          else
            git commit -m "chore: PDCAデータ更新 (${{ github.workflow }})"
            git pull --rebase origin main || true
            git push || echo "push失敗(次回実行時に再試行)"
          fi
